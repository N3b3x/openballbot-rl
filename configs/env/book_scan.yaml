# Book climbing, privileged height scan (upper bound / teacher)
camera:
  enabled: false
  disable_rgb: true
  frame_rate: 90
  height: 64
  width: 64
env:
  max_allowed_tilt: 20
  max_ep_steps: 800
  goal_progress: 2.0
  action_repeat: 5
  max_wheel_velocity: 10.0
  fix_wheel_contacts: true
logging:
  cams: false
  reward_terms: false
reward:
  type: directional
  config:
    action_reg_coef: -0.0001
    scale: 0.1
    survival_bonus: 0.02
    cap: 0.6
    fall_penalty: 10.0
    target_direction:
    - 0.0
    - 1.0
terrain:
  type: book
  config:
    step_y: 0.6
    book_len: 0.0
    rough_amplitude: 0.03
    step_height_m: 0.02
    ranges:
      step_height_m:
      - 0.0
      - 0.04
    seed: null
height_scan:
  x:
  - -0.3
  - 0.3
  - 5
  y:
  - -0.1
  - 0.7
  - 9
