# H3 waypoint config
camera:
  enabled: true
  disable_rgb: true
  frame_rate: 90
  height: 64
  width: 64
env:
  max_allowed_tilt: 20
  max_ep_steps: 800
  action_repeat: 5
  max_wheel_velocity: 10.0
  fix_wheel_contacts: true
  goal_mode: relative
  goal_radius: 0.3
  goal_dist_range:
  - 2.0
  - 3.0
  goal_bearing_deg: 60.0
logging:
  cams: false
  reward_terms: false
reward:
  type: directional
  config:
    action_reg_coef: -0.0001
    scale: 0.1
    survival_bonus: 0.02
    cap: 0.6
    target_direction:
    - 0.0
    - 1.0
    fall_penalty: 10.0
terrain:
  type: perlin
  config:
    scale: 25.0
    octaves: 4
    persistence: 0.2
    lacunarity: 2.0
    amplitude: 0.08
    amplitude_range:
    - 0.02
    - 0.14
    seed: null
