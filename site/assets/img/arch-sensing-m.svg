<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" class="d-sense" role="img" aria-labelledby="dnm-t">
<title id="dnm-t">Sensing pipeline, top to bottom: ToF ranges, hit points, memory, occupancy grid, distance field; a dashed arrow from the distance field back to the sensor shows that the planner aims the sensor.</title>
<style>
.d-sense text{font-family:Inter,system-ui,sans-serif;font-size:13px;fill:var(--text,#dfe6f0)}
.d-sense .m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;fill:var(--text-2,#9aa8bb)}
.d-sense .k{fill:var(--text-3,#8a97ab);font-size:11px}
.d-sense .h{font-size:14px;font-weight:600}
.d-sense .bx{fill:var(--bg-3,#161e2a);stroke-width:1.8;stroke:var(--model,#4aa8ff)}
.d-sense .w{fill:none;stroke:var(--line-2,#5a6b84);stroke-width:1.6}
</style>
<defs><marker id="dnm-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:var(--line-2,#5a6b84)"/></marker></defs>
<g data-d="tof" class="node" tabindex="0" role="button" aria-label="ToF sensor">
<rect x="30" y="12" width="270" height="92" rx="10" class="bx" style="stroke:var(--warn,#ffb454)"/>
<text x="44" y="36" class="h">ToF ranges</text>
<text x="44" y="56" class="m">18 x 14 zones, 55 x 42 deg</text><text x="44" y="72" class="m">noise 0.5 %, dropout 2 %</text><text x="44" y="90" class="k">head mount, 15 cm up, pitch -25 deg</text>
</g>
<path d="M165 104V128" class="w" marker-end="url(#dnm-a)"/>
<g data-d="hits" class="node" tabindex="0" role="button" aria-label="Hit points">
<rect x="30" y="130" width="270" height="74" rx="10" class="bx"/>
<text x="44" y="154" class="h">Hit points</text>
<text x="44" y="174" class="m">range x ray direction + sensor pose</text><text x="44" y="190" class="m">= 3-D point in the world frame</text>
</g>
<path d="M165 204V228" class="w" marker-end="url(#dnm-a)"/>
<g data-d="mem" class="node" tabindex="0" role="button" aria-label="Memory">
<rect x="30" y="230" width="270" height="74" rx="10" class="bx"/>
<text x="44" y="254" class="h">Memory</text>
<text x="44" y="274" class="m">keep hits &gt; 3 cm above the ground</text><text x="44" y="290" class="m">600 points per world</text>
</g>
<path d="M165 304V328" class="w" marker-end="url(#dnm-a)"/>
<g data-d="occ" class="node" tabindex="0" role="button" aria-label="Occupancy grid">
<rect x="30" y="330" width="270" height="74" rx="10" class="bx"/>
<text x="44" y="354" class="h">Occupancy</text>
<text x="44" y="374" class="m">64 x 64 cells of 5 cm</text><text x="44" y="390" class="m">inflated by 0.22 m</text>
</g>
<path d="M165 404V428" class="w" marker-end="url(#dnm-a)"/>
<g data-d="field" class="node" tabindex="0" role="button" aria-label="Distance field">
<rect x="30" y="430" width="270" height="92" rx="10" class="bx" style="stroke:var(--hybrid,#2ee6c4)"/>
<text x="44" y="454" class="h">Distance field</text>
<text x="44" y="474" class="m">goal = 0, 8-connected sweeps</text><text x="44" y="490" class="m">replanned every 0.2 s</text><text x="44" y="508" class="k">read by the carrot follower</text>
</g>
<path d="M300 476H330V58H304" class="w" marker-end="url(#dnm-a)" style="stroke-dasharray:5 4"/>
<text x="30" y="556" class="k">Dashed: the planner aims the sensor at its</text>
<text x="30" y="572" class="k">target heading (S90). No learning in the map;</text>
<text x="30" y="588" class="k">the balance controller never sees it.</text>
</svg>
