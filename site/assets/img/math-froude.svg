<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" class="d-fr" role="img" aria-labelledby="df-t">
<title id="df-t">Froude scaling: a robot scaled by s in every length has masses scaled by s cubed, speeds by the square root of s, torques by s to the fourth and the same lean angles. The nominal robot and a 1.5 times robot are drawn side by side.</title>
<style>
.d-fr text{font-family:Inter,system-ui,sans-serif;font-size:13px;fill:var(--text,#dfe6f0)}
.d-fr .m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;fill:var(--text-2,#9aa8bb)}
.d-fr .k{fill:var(--text-3,#8a97ab);font-size:11px}
</style>
<defs><marker id="df-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:var(--model,#4aa8ff)"/></marker></defs>
<line x1="10" y1="236" x2="550" y2="236" style="stroke:var(--line-2,#5a6b84);stroke-width:2"/>
<!-- nominal: r 30 px -->
<g transform="translate(110 206)">
<circle r="30" style="fill:var(--bg-3,#161e2a);stroke:var(--model,#4aa8ff);stroke-width:2"/>
<g transform="rotate(10)"><rect x="-11" y="-116" width="22" height="90" rx="7" style="fill:var(--bg-3,#161e2a);stroke:var(--model,#4aa8ff);stroke-width:2"/><circle cy="-84" r="4" style="fill:var(--warn,#ffb454)"/></g>
<line x1="34" y1="-50" x2="74" y2="-50" style="stroke:var(--model,#4aa8ff);stroke-width:2.2" marker-end="url(#df-ar)"/>
</g>
<text x="60" y="262" class="m">s = 1: ball 9 cm</text>
<text x="60" y="280" class="k">speeds v, pushes 5 to 20 N</text>
<!-- 1.5x: r 45 px -->
<g transform="translate(360 191)">
<circle r="45" style="fill:var(--bg-3,#161e2a);stroke:var(--model,#4aa8ff);stroke-width:2"/>
<g transform="rotate(10)"><rect x="-16.5" y="-174" width="33" height="135" rx="10" style="fill:var(--bg-3,#161e2a);stroke:var(--model,#4aa8ff);stroke-width:2"/><circle cy="-126" r="5" style="fill:var(--warn,#ffb454)"/></g>
<line x1="50" y1="-75" x2="99" y2="-75" style="stroke:var(--model,#4aa8ff);stroke-width:2.2" marker-end="url(#df-ar)"/>
</g>
<text x="290" y="262" class="m">s = 1.5: ball 13.5 cm</text>
<text x="290" y="280" class="k">speeds x 1.22, pushes 16.9 to 67.5 N</text>
<!-- scaling table on the right/top -->
<g class="m">
<text x="14" y="26" style="fill:var(--text,#dfe6f0);font-family:Inter,system-ui,sans-serif">Scale every length by s. Then:</text>
<text x="14" y="48">length   x s</text>
<text x="14" y="66">mass     x s³</text>
<text x="14" y="84">inertia  x s⁵</text>
<text x="170" y="48">time     x sqrt(s)</text>
<text x="170" y="66">speed    x sqrt(s)</text>
<text x="170" y="84">accel.   x 1</text>
<text x="340" y="48">force    x s³</text>
<text x="340" y="66">torque   x s⁴</text>
<text x="340" y="84">angles   x 1 (same lean)</text>
</g>
<text x="14" y="112" class="k">Same lean, same shape of motion, just slower per metre: the big robot takes sqrt(1.5) times longer to do the same thing.</text>
</svg>
